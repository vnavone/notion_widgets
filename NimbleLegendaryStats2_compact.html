<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimble Legendary Monster Stats</title>
  <style>
    fieldset {
      text-align: left;
    }
    legend {
      text-align: center;
    }
    #levelTitle {
      font-size: 1.2em;
    }
    select, input {
      margin: 10px;
    }
    #statBlock {
      margin-top: 15px;
    }
    .note {
      margin-top: 15px;
      font-size: 0.85em;
      opacity: 0.75;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="https://vnavone.github.io/notion_widgets/style.css">
</head>
<body>
  <div id="container">
    <fieldset>
      <legend><b>Nimble Legendary Monster Stats</b></legend>
      <label for="levelSelect">Select Party Level:</label>
      <select id="levelSelect">
        <option value="1" selected>Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
        <option value="6">Level 6</option>
        <option value="7">Level 7</option>
        <option value="8">Level 8</option>
        <option value="9">Level 9</option>
        <option value="10">Level 10</option>
        <option value="11">Level 11</option>
        <option value="12">Level 12</option>
        <option value="13">Level 13</option>
        <option value="14">Level 14</option>
        <option value="15">Level 15</option>
        <option value="16">Level 16</option>
        <option value="17">Level 17</option>
        <option value="18">Level 18</option>
        <option value="19">Level 19</option>
        <option value="20">Level 20</option>
      </select>
      <div id="statBlock">
        <!-- Stat Block -->
      </div>
    </fieldset>
  </div>

  <script>
    // Field order here controls display order.
    const fields = [
      "Unarmored",
      "Med Armor",
      "Heavy Armor",
      "Save DC",
      "Small Attack Dmg",
      "Big Attack Dmg"
    ];

    // Each row: [level, ...values in the same order as `fields`]
    const rows = [
      ["1", "22 (3)", "—", "—", 10, 5, 8],
      ["2", "28 (7)", "—", "—", 11, 6, 10],
      ["3", "40 (10)", "—", "—", 11, 8, 14],
      ["4", "44 (13)", "28 (7)*", "—", 12, 10, 15],
      ["5", "48 (17)", "40 (11)*", "—", 12, 11, 18],
      ["6", "56 (20)", "50 (14)", "—", 13, 13, 21],
      ["7", "64 (23)", "58 (17)", "42 (10)*", 13, 14, 22],
      ["8", "71 (27)", "64 (19)", "50 (14)*", 14, 16, 25],
      ["9", "79 (30)", "71 (22)", "58 (17)*", 14, 17, 27],
      ["10", "86 (33)", "77 (24)", "64 (20)", 15, 19, 30],
      ["11", "94 (37)", "85 (27)", "70 (22)", 15, 20, 32],
      ["12", "102 (40)", "92 (29)", "76 (24)", 16, 22, 34],
      ["13", "109 (43)", "98 (31)", "82 (26)", 16, 23, 36],
      ["14", "117 (47)", "105 (34)", "88 (28)", 17, 24, 39],
      ["15", "125 (50)", "112 (36)", "94 (30)", 17, 26, 41],
      ["16", "132 (53)", "119 (38)", "99 (32)", 18, 28, 44],
      ["17", "140 (57)", "126 (41)", "105 (34)", 18, 30, 48],
      ["18", "147 (60)", "133 (43)", "110 (36)", 19, 32, 50],
      ["19", "155 (63)", "141 (46)", "116 (38)", 19, 34, 53],
      ["20", "166 (67)", "151 (49)", "124 (40)", 20, 37, 58]
    ];

    // Build the lookup object from the rows
    const data = {};
    rows.forEach(row => {
      const level = row[0];
      data[level] = {};
      fields.forEach((field, i) => {
        data[level][field] = row[i + 1];
      });
    });

    const levelSelect = document.getElementById('levelSelect');

    // Show stats
    function showStats() {
      const level = levelSelect.value;
      const stats = data[level];
      let output = `<div id='levelTitle'><strong>Party Level ${level}</strong></div><br>`;
      // Save DC is shown after the attack lines
      const order = Object.keys(stats).filter(k => k !== "Save DC").concat("Save DC");
      for (const key of order) {
        let value = stats[key];
        // HP values like "71 (27)" or "50 (14)*" -> "71 HP/Hero (Last Stand: 27)" with the Last Stand part italic
        value = String(value).replace(
          /^(\d+) \((\d+)\)(\*?)$/,
          "$1 HP/Hero (<em>Last Stand: $2</em>)$3"
        );
        output += `<strong>${key}:</strong> ${value}<br>`;
      }
      output += `<div class='note'>*Not recommended to introduce Medium Armor before level 3, or Heavy Armor before level 8.</div>`;
      document.getElementById('statBlock').innerHTML = output;
    }

    levelSelect.addEventListener('change', showStats);

    // Show initial stats
    showStats();
  </script>
</body>
</html>
