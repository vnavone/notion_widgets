<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimble Monster Stats</title>
  <style>
    fieldset {
      text-align: left;
    }
    legend {
      text-align: center;
    }
    #levelTitle {
      font-size: 1.2em;
    }
    select, input {
      margin: 10px;
    }
    #statBlock {
      margin-top: 15px;
    }
    .note {
      margin-top: 15px;
      font-size: 0.85em;
      opacity: 0.75;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="https://vnavone.github.io/notion_widgets/style.css">
</head>
<body>
  <div id="container">
    <fieldset>
      <legend><b>Nimble Monster Stats</b></legend>
      <label for="levelSelect">Select Monster Level:</label>
      <select id="levelSelect">
        <option value="1/3">Level 1/3</option>
        <option value="1/2">Level 1/2</option>
        <option value="1" selected>Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
        <option value="6">Level 6</option>
        <option value="7">Level 7</option>
        <option value="8">Level 8</option>
        <option value="9">Level 9</option>
        <option value="10">Level 10</option>
        <option value="11">Level 11</option>
        <option value="12">Level 12</option>
        <option value="13">Level 13</option>
        <option value="14">Level 14</option>
        <option value="15">Level 15</option>
        <option value="16">Level 16</option>
        <option value="17">Level 17</option>
        <option value="18">Level 18</option>
        <option value="19">Level 19</option>
        <option value="20">Level 20</option>
      </select>
      <div id="statBlock">
        <!-- Stat Block -->
      </div>
    </fieldset>
  </div>
  <script>
    // Field order here controls display order.
    const fields = [
      "Unarmored",
      "Medium Armor",
      "Heavy Armor",
      "Damage 1 Attack",
      "Damage 2 Attacks",
      "Damage 3 Attacks",
      "Sample Dice 1 Attack",
      "Sample Dice 2 Attacks",
      "Sample Dice 3 Attacks",
      "Save DC",
      "CR Equivalent"
    ];

    // Each row: [level, ...values in the same order as `fields`]
    const rows = [
      ["1/3", 10, "-", "-", "2.5 (can't crit)", "-", "-", "1d4 (can't crit)", "-", "-", 10, "1/8"],
      ["1/2", 15, "-", "-", "4.5 (can't crit)", "-", "-", "1d6+1 or 1d8 (can't crit)", "-", "-", 11, "1/4"],
      ["1", 21, "12*", "-", 7, "-", "-", "2d6 or 1d12", "-", "-", 11, "1/2"],
      ["2", 31, "19*", "-", 10, 4, "-", "3d6 or 1d6+6", "1d6", "-", 11, "1"],
      ["3", 41, 27, "-", 14, 6, "-", "1d8+10", "1d10", "-", 12, "1"],
      ["4", 52, 37, "24*", 17, 8, "-", "2d6+10", "1d6+5", "-", 12, "2"],
      ["5", 64, 49, "30*", 20, 9, 5, "1d10+15", "1d6+6", "1d8", 13, "2"],
      ["6", 75, 60, "37*", 24, 10, 6, "1d8+20", "3d6", "1d10", 13, "3"],
      ["7", 87, 72, "44*", 27, 12, 7, "1d12+20 or d44", "1d8+8", "1d12", 13, "3"],
      ["8", 100, 84, 60, 30, 13, 7.5, "2d8+20", "1d6+10", "2d6", 13, "4"],
      ["9", 112, 95, 73, 33, 14, 8, "1d6+30", "1d8+10", "1d6+5", 14, "4"],
      ["10", 126, 107, 88, 37, 16, 9, "2d6+30 or d44+10", "1d12+10", "2d8", 14, "5"],
      ["11", 140, 121, 97, 40, 17, 10, "2d8+30 or d66", "1d12+10", "1d10+5", 14, "6"],
      ["12", 155, 135, 105, 43, 19, 11, "2d12+30", "1d8+15", "1d20", 15, "7"],
      ["13", 170, 150, 112, 46, 20, 12, "1d20+35 or d66+10", "1d10+15", "1d8+8", 15, "8"],
      ["14", 186, 165, 119, 49, 22, 13, "1d20+40 or d88", "2d8+10", "1d6+10", 15, "9"],
      ["15", 202, 180, 125, 52, 23, 13.5, "2d10+40", "1d6+20", "1d6+10", 15, "9"],
      ["16", 219, 196, 139, 55, 25, 14, "1d10+50", "1d8+20", "1d8+10", 16, "10"],
      ["17", 236, 212, 152, 58, 26, 15, "2d8+50", "1d12+20", "1d10+10", 16, "11"],
      ["18", 254, 230, 167, 61, 27, 16, "2d10+50 or d88+10", "1d12+20", "1d10+10", 16, "12"],
      ["19", 272, 247, 182, 64, 28, 17, "1d8+60", "1d6+25", "1d12+10", 17, "13"],
      ["20", 292, 266, 199, 68, 30, 18, "2d10+60", "1d20+20", "1d12+12", 18, "14"]
    ];

    // Build the lookup object from the rows
    const data = {};
    rows.forEach(row => {
      const level = row[0];
      data[level] = {};
      fields.forEach((field, i) => {
        data[level][field] = row[i + 1];
      });
    });

    const levelSelect = document.getElementById('levelSelect');

    // Show stats
    function showStats() {
      const level = levelSelect.value;
      const stats = data[level];
      let output = `<div id='levelTitle'><strong>Monster Level ${level}</strong></div><br>`;
      const crit = " (can't crit)";
      for (const key in stats) {
        // Sample Dice are merged into the Damage lines below
        if (key.startsWith("Sample Dice")) continue;
        let value = stats[key];
        if (key.startsWith("Damage") && value !== "-") {
          let dmg = String(value);
          let dice = String(stats[key.replace("Damage", "Sample Dice")]);
          if (dmg.endsWith(crit)) {
            dmg = dmg.slice(0, -crit.length);
            dice = dice.endsWith(crit) ? dice.slice(0, -crit.length) : dice;
            value = `${dmg} (${dice}, can't crit)`;
          } else {
            value = `${dmg} (${dice})`;
          }
        }
        let label = key;
        if (["Unarmored", "Medium Armor", "Heavy Armor"].includes(key)) {
          // "52" -> "52 HP", "24*" -> "24 HP*"; "-" stays as is
          value = String(value).replace(/^(\d+(?:\.\d+)?)(\*?)$/, "$1 HP$2");
        }
        if (key.startsWith("Damage")) {
          // "Damage 1 Attack" -> "Damage (1 Attack)"
          label = key.replace(/^Damage (.*)$/, "Damage ($1)");
        }
        output += `<strong>${label}:</strong> ${value}<br>`;
      }
      output += `<div class='note'>*Not recommended to introduce Medium Armor before level 3, or Heavy Armor before level 8.</div>`;
      document.getElementById('statBlock').innerHTML = output;
    }

    levelSelect.addEventListener('change', showStats);

    // Show initial stats
    showStats();
  </script>
</body>
</html>
